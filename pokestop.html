<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケストップ</title>

  <style>
    body { font-family: sans-serif; text-align: center; background: #1e272e; color: white; margin: 0; padding: 20px; }
    .card { background: #2f3640; border: 4px solid #00a8ff; border-radius: 15px; padding: 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
    
    .spot-photo {
      width: 100%; height: 180px; object-fit: cover; border-radius: 10px; border: 2px solid #00a8ff; margin-bottom: 10px;
    }

    #stopDesc {
      font-size: 13px;
      color: #a4b0be;
      background: #1e272e;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: left;
      border-left: 3px solid #00a8ff;
    }

    button { background: #00a8ff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; }
    button:disabled { background: #57606f; cursor: not-allowed; }
    .warning-msg { color: #ff6b6b; font-size: 14px; margin-top: 10px; font-weight: bold; }
    #itemResult { font-size: 18px; color: #fbc531; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="header-container"></div>

  <div class="card">
    <img id="stopPhoto" src="" alt="ポケストップの写真" class="spot-photo" onerror="this.style.display='none'">

    <div id="stopDesc">スポットの説明文を読み込んでいます...</div>

    <h1 id="stopTitle">🌀 ポケストップ</h1>
    <p>フォトディスクを回して「きのみ」を手に入れよう！</p>
    <p id="berryCount" style="color: #ff7675; font-weight: bold;"></p>
    
    <div id="qrWarning" class="warning-msg" style="display: none;">⚠️ 現地のQRコードからアクセスしてください</div>
    <div id="itemResult"></div>
    
    <button id="spinBtn" onclick="spinPokestop()">フォトディスクを回す</button>
    <br><br>
    <a href="index.html" style="color: #808e9b; text-decoration: none;">← マップに戻る</a>
  </div>

  <!-- スポットデータファイルを読み込む -->
  <script src="spots.js"></script>

  <script>
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
        const myName = localStorage.getItem("myPlayerName") || "名無しプレイヤー";
        const myTeam = localStorage.getItem("myTeam") || "blue";

        const nameSpan = document.getElementById("headerAccountName");
        if (nameSpan) nameSpan.innerText = myName;
        const teamSpan = document.getElementById("headerTeamName");
        if (teamSpan) {
          if (myTeam === "blue") { teamSpan.innerText = "青チーム"; teamSpan.style.color = "#00a8ff"; }
          else if (myTeam === "red") { teamSpan.innerText = "赤チーム"; teamSpan.style.color = "#e84118"; }
          else if (myTeam === "yellow") { teamSpan.innerText = "黄チーム"; teamSpan.style.color = "#fbc531"; }
        }
      });

    const urlParams = new URLSearchParams(window.location.search);
    let stopId = urlParams.get("id") || "room";

    // 余計なスラッシュやクエリが混ざっていたら手前で安全にカットする
    if (stopId.includes("/")) {
      stopId = stopId.split("/")[0];
    }

    const hasValidQR = urlParams.get("qr") === "open";

    // ブラウザバック対策：アクセス直後にURLから ?qr=open を綺麗に消去
    if (hasValidQR) {
      const cleanUrl = window.location.pathname + "?id=" + stopId;
      window.history.replaceState(null, '', cleanUrl);
    }

    // spots.js からデータを自動取得して画面に反映！
    const stopInfo = SPOT_DATA[stopId] || { name: stopId, desc: "説明文がありません。", photo: "photo.jpg" };
    document.getElementById("stopTitle").innerText = `🌀 ${stopInfo.name}`;
    document.getElementById("stopPhoto").src = stopInfo.photo;
    document.getElementById("stopDesc").innerText = stopInfo.desc;

    const spinBtn = document.getElementById("spinBtn");
    const qrWarning = document.getElementById("qrWarning");
    const itemResult = document.getElementById("itemResult");
    const berryCountText = document.getElementById("berryCount");

    const stopKey = "lastSpin_pokestop_" + stopId; // スポットごとに個別クールダウン
    const COOLDOWN_TIME = 5 * 60 * 1000;

    function updateBerryDisplay() {
      const berries = parseInt(localStorage.getItem("myBerries")) || 0;
      berryCountText.innerText = `所持きのみ: ${berries}個`;
    }

    function checkSpinCooldown() {
      if (!hasValidQR) {
        spinBtn.disabled = true;
        spinBtn.innerText = "QR未読込（回せない）";
        qrWarning.style.display = "block";
        return;
      }

      const lastSpin = parseInt(localStorage.getItem(stopKey)) || 0;
      const now = Date.now();
      const diff = now - lastSpin;

      if (diff < COOLDOWN_TIME) {
        spinBtn.disabled = true;
        const remainSec = Math.ceil((COOLDOWN_TIME - diff) / 1000);
        const min = Math.floor(remainSec / 60);
        const sec = remainSec % 60;
        spinBtn.innerText = `補給完了 (${min}:${sec < 10 ? '0' : ''}${sec})`;
      } else {
        spinBtn.disabled = false;
        spinBtn.innerText = "フォトディスクを回す";
        qrWarning.style.display = "none";
      }
    }

    setInterval(checkSpinCooldown, 1000);
    updateBerryDisplay();
    checkSpinCooldown();

    function spinPokestop() {
      if (!hasValidQR) return;

      const lastSpin = parseInt(localStorage.getItem(stopKey)) || 0;
      if (Date.now() - lastSpin < COOLDOWN_TIME) return;

      localStorage.setItem(stopKey, Date.now().toString());

      const gotBerries = Math.floor(Math.random() * 3) + 1;
      let currentBerries = parseInt(localStorage.getItem("myBerries")) || 0;
      currentBerries += gotBerries;
      localStorage.setItem("myBerries", currentBerries);

      updateBerryDisplay();
      itemResult.innerText = `🎁 きのみ を ${gotBerries}個 手に入れた！`;
      checkSpinCooldown();
    }
  </script>

</body>
</html>
