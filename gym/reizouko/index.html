<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジム：冷蔵庫</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: sans-serif; text-align: center; background: #1e272e; color: white; margin: 0; padding: 20px; }
    .card { 
      background: #2f3640; border: 4px solid #718093; border-radius: 15px; padding: 20px; 
      max-width: 400px; margin: 0 auto; box-shadow: 0 8px 16px rgba(0,0,0,0.4); transition: border-color 0.3s;
    }
    .team-blue { border-color: #00a8ff; }
    .team-red { border-color: #e84118; }
    .team-yellow { border-color: #fbc531; }
    .team-neutral { border-color: #718093; }

    .spot-photo {
      width: 100%; height: 180px; object-fit: cover; border-radius: 10px; border: 2px solid #718093; margin-bottom: 15px;
    }

    button { background: #00a8ff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; }
    button:disabled { background: #57606f; cursor: not-allowed; }
    
    #timer { font-size: 24px; color: #fbc531; margin: 15px 0; font-weight: bold; }
    #defenseTime, #gymStrength { font-size: 14px; color: #718093; margin-top: 5px; }
    .warning-msg { color: #ff6b6b; font-size: 14px; margin-top: 10px; font-weight: bold; }
    #itemResult { font-size: 16px; color: #fbc531; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="header-container"></div>

  <div class="card" id="gymCard">
    <img src="photo.jpg" alt="冷蔵庫ジムの写真" class="spot-photo" onerror="this.style.display='none'">

    <h1>⚔️ ジム: 冷蔵庫</h1>
    <p id="status">現在の状態: 読み込み中...</p>
    <div id="defenseTime">防衛時間: -</div>
    <div id="gymStrength">ジムの強さ: - / 60</div>
    
    <div id="timer" style="display: none;">残り時間: <span id="countdown">60</span>秒</div>
    <div id="qrWarning" class="warning-msg" style="display: none;">⚠️ 現地のQRコードからアクセスしてください</div>
    
    <button id="attackBtn" onclick="startBattle()">ジムに挑む</button>
    <button id="feedBtn" onclick="feedBerry()" style="background: #e056fd; display: none;">きのみをあげる (残り: <span id="berryNum">0</span>個)</button>
    
    <!-- フォトディスクを回す機能（5分に1回） -->
    <hr style="border: 0; border-top: 1px solid #718093; margin: 20px 0;">
    <button id="spinBtn" onclick="spinGymDisc()" style="background: #e1b12c;">フォトディスクを回す</button>
    <div id="itemResult"></div>

    <br><br>
    <a href="../../index.html" style="color: #808e9b; text-decoration: none;">← マップに戻る</a>
  </div>

  <script>
    fetch('../../header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
        const myName = localStorage.getItem("myPlayerName") || "名無しプレイヤー";
        const myTeam = localStorage.getItem("myTeam") || "blue";

        const nameSpan = document.getElementById("headerAccountName");
        if (nameSpan) nameSpan.innerText = myName;
        const teamSpan = document.getElementById("headerTeamName");
        if (teamSpan) {
          if (myTeam === "blue") { teamSpan.innerText = "青チーム"; teamSpan.style.color = "#00a8ff"; }
          else if (myTeam === "red") { teamSpan.innerText = "赤チーム"; teamSpan.style.color = "#e84118"; }
          else if (myTeam === "yellow") { teamSpan.innerText = "黄チーム"; teamSpan.style.color = "#fbc531"; }
        }
      });

    const firebaseConfig = {
      apiKey: "AIzaSyDQF-SGTV70zmFyS_Mquz_OVgn260X0Aqs",
      authDomain: "kokemon-go.firebaseapp.com",
      projectId: "kokemon-go",
      storageBucket: "kokemon-go.firebasestorage.app",
      messagingSenderId: "391436988134",
      appId: "1:391436988134:web:2a80a98886d1a251211527"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const gymId = "reizouko";
    const statusText = document.getElementById("status");
    const defenseTimeText = document.getElementById("defenseTime");
    const strengthText = document.getElementById("gymStrength");
    const attackBtn = document.getElementById("attackBtn");
    const feedBtn = document.getElementById("feedBtn");
    const spinBtn = document.getElementById("spinBtn");
    const itemResult = document.getElementById("itemResult");
    const berryNumSpan = document.getElementById("berryNum");
    const timerDiv = document.getElementById("timer");
    const countdownSpan = document.getElementById("countdown");
    const gymCard = document.getElementById("gymCard");
    const qrWarning = document.getElementById("qrWarning");

    const myPlayerName = localStorage.getItem("myPlayerName") || "名無しプレイヤー";
    const myTeamColor = localStorage.getItem("myTeam") || "blue";

    const urlParams = new URLSearchParams(window.location.search);
    const hasValidQR = urlParams.get("qr") === "open";

    let cachedUpdatedAt = null;
    let cachedFedBonus = 0;
    let defenseTimerInterval = null;
    let currentStrength = 60;

    const COOLDOWN_TIME = 5 * 60 * 1000;
    const gymSpinKey = "lastSpin_gym_" + gymId;

    function checkSpinCooldown() {
      if (!hasValidQR) {
        spinBtn.disabled = true;
        spinBtn.innerText = "QR未読込（回せない）";
        return;
      }

      const lastSpin = parseInt(localStorage.getItem(gymSpinKey)) || 0;
      const now = Date.now();
      const diff = now - lastSpin;

      if (diff < COOLDOWN_TIME) {
        spinBtn.disabled = true;
        const remainSec = Math.ceil((COOLDOWN_TIME - diff) / 1000);
        const min = Math.floor(remainSec / 60);
        const sec = remainSec % 60;
        spinBtn.innerText = `補給完了 (${min}:${sec < 10 ? '0' : ''}${sec})`;
      } else {
        spinBtn.disabled = false;
        spinBtn.innerText = "フォトディスクを回す";
      }
    }

    setInterval(checkSpinCooldown, 1000);

    function spinGymDisc() {
      if (!hasValidQR) return;

      const lastSpin = parseInt(localStorage.getItem(gymSpinKey)) || 0;
      if (Date.now() - lastSpin < COOLDOWN_TIME) return;

      localStorage.setItem(gymSpinKey, Date.now().toString());

      const gotBerries = Math.floor(Math.random() * 3) + 1;
      let currentBerries = parseInt(localStorage.getItem("myBerries")) || 0;
      currentBerries += gotBerries;
      localStorage.setItem("myBerries", currentBerries);

      updateBerryUI();
      itemResult.innerText = `🎁 きのみ を ${gotBerries}個 手に入れた！`;
      checkSpinCooldown();
    }

    function formatDefenseTime(totalSeconds) {
      if (totalSeconds < 0) return "0秒";
      const days = Math.floor(totalSeconds / (3600 * 24));
      const hours = Math.floor((totalSeconds % (3600 * 24)) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      let result = "";
      if (days > 0) result += `${days}日 `;
      if (days > 0 || hours > 0) result += `${hours}時間 `;
      if (days > 0 || hours > 0 || minutes > 0) result += `${minutes}分 `;
      result += `${seconds}秒`;
      return result;
    }

    function updateBerryUI() {
      const berries = parseInt(localStorage.getItem("myBerries")) || 0;
      berryNumSpan.innerText = berries;
    }

    // ★ 現在の「防衛時間」と「強さ」を再計算して表示を更新する関数
    function updateGymStats() {
      updateBerryUI();

      if (!cachedUpdatedAt) {
        defenseTimeText.innerText = "防衛時間: -";
        strengthText.innerText = "ジムの強さ: - / 60";
        currentStrength = 60;
        return;
      }

      const now = new Date();
      const diffSeconds = Math.floor((now - cachedUpdatedAt) / 1000);
      const diffMinutes = Math.floor(diffSeconds / 60);

      // 防衛時間の更新（減らない）
      defenseTimeText.innerText = `防衛時間: ${formatDefenseTime(diffSeconds)}`;

      // 強さの計算：基本(60 - 経過分数) + きのみ回復(cachedFedBonus)
      const baseStrength = 60 - diffMinutes;
      const calculatedStrength = baseStrength + cachedFedBonus;

      // 最大60、最低10に収める
      currentStrength = Math.min(60, Math.max(10, calculatedStrength));
      strengthText.innerText = `ジムの強さ: ${currentStrength} / 60`;
    }

    function startDefenseTimer() {
      if (defenseTimerInterval) clearInterval(defenseTimerInterval);
      defenseTimerInterval = setInterval(updateGymStats, 1000);
    }

    function watchGymStatus() {
      db.collection("gyms").doc(gymId).onSnapshot((doc) => {
        if (doc.exists) {
          const data = doc.data();
          const owner = data.owner || "なし";
          const team = data.team || "neutral";

          statusText.innerText = `現在のオーナー: ${owner}`;
          gymCard.className = "card team-" + team;

          // ★ Firestoreの最新のきのみボーナス（fedBonus）を取得
          cachedFedBonus = data.fedBonus || 0;

          if (data.updatedAt) {
            cachedUpdatedAt = data.updatedAt.toDate();
            updateGymStats();
            startDefenseTimer();
          } else {
            cachedUpdatedAt = null;
            updateGymStats();
          }

          if (!hasValidQR) {
            attackBtn.innerText = "QR未読込（バトル不可）";
            attackBtn.disabled = true;
            feedBtn.style.display = "none";
            qrWarning.style.display = "block";
          } else {
            qrWarning.style.display = "none";
            if (owner === myPlayerName) {
              attackBtn.innerText = "自分のジムです（防衛中）";
              attackBtn.disabled = true;
              feedBtn.style.display = "block";
            } else {
              attackBtn.innerText = "ジムに挑む";
              attackBtn.disabled = false;
              feedBtn.style.display = "none";
            }
          }

        } else {
          statusText.innerText = "現在のオーナー: なし（中立）";
          cachedUpdatedAt = null;
          cachedFedBonus = 0;
          updateGymStats();

          if (!hasValidQR) {
            attackBtn.innerText = "QR未読込（バトル不可）";
            attackBtn.disabled = true;
            feedBtn.style.display = "none";
            qrWarning.style.display = "block";
          } else {
            attackBtn.innerText = "ジムに挑む";
            attackBtn.disabled = false;
            feedBtn.style.display = "none";
            qrWarning.style.display = "none";
          }
        }
      });
    }

    function startBattle() {
      if (!hasValidQR) {
        alert("現地にあるQRコードを読み込んでください！");
        return;
      }

      attackBtn.style.display = "none";
      feedBtn.style.display = "none";
      spinBtn.style.display = "none";
      timerDiv.style.display = "block";
      
      let timeLeft = currentStrength;
      countdownSpan.innerText = timeLeft;

      const timer = setInterval(() => {
        timeLeft--;
        countdownSpan.innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          timerDiv.style.display = "none";
          attackBtn.style.display = "block";
          spinBtn.style.display = "block";
          
          saveGymOwner(myPlayerName, myTeamColor);
        }
      }, 1000);
    }

    // ★ きのみをあげる処理
    function feedBerry() {
      let berries = parseInt(localStorage.getItem("myBerries")) || 0;
      if (berries <= 0) {
        alert("きのみを持っていません！ポケストップで集めましょう。");
        return;
      }

      if (currentStrength >= 60) {
        alert("ジムの強さはすでに最大です！");
        return;
      }

      berries--;
      localStorage.setItem("myBerries", berries);
      updateBerryUI();

      // Firestore の fedBonus を 1 増やす（onSnapshot で自動検知されて強さが1回復）
      db.collection("gyms").doc(gymId).update({
        fedBonus: firebase.firestore.FieldValue.increment(1)
      }).then(() => {
        // 成功
      }).catch((error) => {
        alert("きのみをあげるのに失敗しました: " + error.message);
      });
    }

    function saveGymOwner(newOwner, teamColor) {
      db.collection("gyms").doc(gymId).set({
        owner: newOwner,
        team: teamColor,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        fedBonus: 0
      }).then(() => {
        alert("ジムを制圧しました！");
      }).catch((error) => {
        alert("保存に失敗しました: " + error.message);
      });
    }

    watchGymStatus();
    checkSpinCooldown();
  </script>

</body>
</html>
