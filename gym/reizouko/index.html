<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジム：冷蔵庫</title>
  
  <!-- Firebaseの読み込み -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: sans-serif; text-align: center; background: #1e272e; color: white; margin: 0; padding: 20px; }
    
    /* ジムカード（チームの色によって枠線が変わる） */
    .card { 
      background: #2f3640; 
      border: 4px solid #718093; 
      border-radius: 15px; 
      padding: 20px; 
      max-width: 400px; 
      margin: 0 auto; 
      box-shadow: 0 8px 16px rgba(0,0,0,0.4); 
      transition: border-color 0.3s;
    }

    /* チームごとの色 */
    .team-blue { border-color: #00a8ff; }
    .team-red { border-color: #e84118; }
    .team-yellow { border-color: #fbc531; }
    .team-neutral { border-color: #718093; }

    button { background: #00a8ff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    button:disabled { background: #57606f; cursor: not-allowed; }
    
    #timer { font-size: 24px; color: #fbc531; margin: 15px 0; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 共通ヘッダーが入る場所 -->
  <div id="header-container"></div>

  <div class="card id-card" id="gymCard">
    <h1>⚔️ ジム: 冷蔵庫</h1>
    <p id="status">現在の状態: 読み込み中...</p>
    
    <div id="timer" style="display: none;">残り時間: <span id="countdown">10</span>秒</div>
    
    <button id="attackBtn" onclick="startBattle()">ジムに挑む</button>
    <br><br>
    <!-- パスを '../../index.html' に修正してしっかりマップに戻れるようにしたよ -->
    <a href="../../index.html" style="color: #808e9b; text-decoration: none;">← マップに戻る</a>
  </div>

  <script>
    // 共通ヘッダーを読み込む処理（深い階層なので '../../header.html' を指定）
    fetch('../../header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;

        const myName = localStorage.getItem("myPlayerName") || "名無しプレイヤー";
        const myTeam = localStorage.getItem("myTeam") || "blue";

        const nameSpan = document.getElementById("headerAccountName");
        if (nameSpan) nameSpan.innerText = myName;

        const teamSpan = document.getElementById("headerTeamName");
        if (teamSpan) {
          if (myTeam === "blue") {
            teamSpan.innerText = "青チーム";
            teamSpan.style.color = "#00a8ff";
          } else if (myTeam === "red") {
            teamSpan.innerText = "赤チーム";
            teamSpan.style.color = "#e84118";
          } else if (myTeam === "yellow") {
            teamSpan.innerText = "黄チーム";
            teamSpan.style.color = "#fbc531";
          }
        }
      });

    const firebaseConfig = {
      apiKey: "AIzaSyDQF-SGTV70zmFyS_Mquz_OVgn260X0Aqs",
      authDomain: "kokemon-go.firebaseapp.com",
      projectId: "kokemon-go",
      storageBucket: "kokemon-go.firebasestorage.app",
      messagingSenderId: "391436988134",
      appId: "1:391436988134:web:2a80a98886d1a251211527"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const gymId = "reizouko";
    const statusText = document.getElementById("status");
    const attackBtn = document.getElementById("attackBtn");
    const timerDiv = document.getElementById("timer");
    const countdownSpan = document.getElementById("countdown");
    const gymCard = document.getElementById("gymCard");

    // localStorage から自分の名前とチームを取得（設定画面で変えた名前が反映される！）
    const myPlayerName = localStorage.getItem("myPlayerName") || "名無しプレイヤー";
    const myTeamColor = localStorage.getItem("myTeam") || "blue";

    // データベースから現在のジムの状態を読み込む
    function loadGymStatus() {
      db.collection("gyms").doc(gymId).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          const owner = data.owner || "なし";
          const team = data.team || "neutral";

          statusText.innerText = `現在のオーナー: ${owner}`;
          gymCard.className = "card team-" + team;

          // 自分がすでに持っているジムなら攻撃ボタンを押せないようにする
          if (owner === myPlayerName) {
            attackBtn.innerText = "自分のジムです（防衛中）";
            attackBtn.disabled = true;
          } else {
            attackBtn.innerText = "ジムに挑む";
            attackBtn.disabled = false;
          }

        } else {
          statusText.innerText = "現在のオーナー: なし（中立）";
          gymCard.className = "card team-neutral";
          attackBtn.innerText = "ジムに挑む";
          attackBtn.disabled = false;
        }
      }).catch((error) => {
        console.error("読み込みエラー:", error);
      });
    }

    // バトルの開始（放置タイマー）
    function startBattle() {
      attackBtn.style.display = "none";
      timerDiv.style.display = "block";
      
      let timeLeft = 10;
      countdownSpan.innerText = timeLeft;

      const timer = setInterval(() => {
        timeLeft--;
        countdownSpan.innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          timerDiv.style.display = "none";
          attackBtn.style.display = "block";
          
          // 勝利したので、自分の名前と「自分が選んだチームの色」でFirebaseに保存！
          saveGymOwner(myPlayerName, myTeamColor);
        }
      }, 1000);
    }

    // Firebaseに新しいオーナーとチームを保存
    function saveGymOwner(newOwner, teamColor) {
      db.collection("gyms").doc(gymId).set({
        owner: newOwner,
        team: teamColor,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("ジムを制圧しました！");
        loadGymStatus();
      }).catch((error) => {
        alert("保存に失敗しました: " + error.message);
      });
    }

    loadGymStatus();
  </script>

</body>
</html>
